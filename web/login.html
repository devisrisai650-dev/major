<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · FloodAI</title>
<style>
:root{color-scheme:dark;--bg:#071219;--panel:#0e2029;--line:#294652;--text:#edf7f8;--muted:#9ab2bb;--teal:#55d6bd;--red:#ff8d84}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 75% -10%,#1b3d46 0,transparent 44%),var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding:20px}.panel{width:min(100%,440px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 20px 70px #0005}.brand{color:var(--teal);font-weight:800;letter-spacing:.14em;font-size:12px}h1{margin:6px 0 4px;font-size:28px}p{color:var(--muted);font-size:13px}label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#071920;color:var(--text);font:inherit}button{width:100%;padding:12px;border:0;border-radius:9px;background:var(--teal);color:#06231f;font-weight:800;font:inherit;cursor:pointer;margin-top:16px}.secondary{background:transparent;border:1px solid var(--line);color:var(--text);margin-top:8px}.hidden{display:none}.message{min-height:22px;color:var(--teal);overflow-wrap:anywhere}.error{color:var(--red)}.small{font-size:12px}
</style></head><body><main class="panel"><div class="brand">FLOODAI · REGIONAL MONITORING</div><h1 id="heading">Welcome back</h1><p id="description">Sign in to view your region's weather and environmental conditions.</p>
<form id="login-form"><label for="email">Email address (Gmail supported)</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"><button id="submit" type="submit">Sign in</button></form>
<form id="register-form" class="hidden"><label for="new-email">Email address</label><input id="new-email" type="email" autocomplete="email" required maxlength="254"><label for="new-password">Create password (10–128 characters)</label><input id="new-password" type="password" autocomplete="new-password" required minlength="10" maxlength="128"><button type="submit">Create account</button></form>
<p id="message" class="message" role="status"></p><button id="toggle" class="secondary" type="button">New to FloodAI? Create an account</button><p class="small">If email verification is enabled, verify your email before signing in. The platform administrator account is provisioned separately and cannot be created here.</p></main>
<script>
const $=id=>document.getElementById(id);let registering=false;
async function call(url,options){const r=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options?.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||"Request failed");return d}
async function check(){try{const d=await call("/api/auth/me");location.replace(d.user.role==="admin"?"/admin":"/")}catch{}}
$("toggle").onclick=()=>{registering=!registering;$("login-form").classList.toggle("hidden",registering);$("register-form").classList.toggle("hidden",!registering);$("heading").textContent=registering?"Create your account":"Welcome back";$("description").textContent=registering?"Register with your email and verify it to receive eligible flood alerts.":"Sign in to view your region's weather and environmental conditions.";$("toggle").textContent=registering?"Already registered? Sign in":"New to FloodAI? Create an account";$("message").textContent="";$("message").className="message"};
$("login-form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;$("message").textContent="Signing in…";try{const d=await call("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("password").value})});location.replace(d.user.role==="admin"?"/admin":"/")}catch(err){$("message").textContent=err.message;$("message").className="message error"}finally{$("submit").disabled=false}};
$("register-form").onsubmit=async e=>{e.preventDefault();const b=$("register-form").querySelector("button");b.disabled=true;$("message").textContent="Creating account…";try{const d=await call("/api/auth/register",{method:"POST",body:JSON.stringify({email:$("new-email").value,password:$("new-password").value})});$("message").textContent=!d.verification_required?"Account created. You can sign in now.":(d.verification_email_sent?"Account created. Check your inbox and verify your email before signing in.":"Account created, but the verification email could not be sent. Contact the platform administrator.");if(d.verification_required&&!d.verification_email_sent)$("message").className="message error"}catch(err){$("message").textContent=err.message;$("message").className="message error"}finally{b.disabled=false}};
check();
</script></body></html>
