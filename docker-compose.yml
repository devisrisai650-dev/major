services:
  floodai-api:
    build: .
    container_name: floodai-api
    ports:
      - "8000:8000"
    environment:
      FLOODAI_ENV: docker
      FLOODAI_AUTH_DB: /app/data/floodai_auth.sqlite3
      FLOODAI_ADMIN_EMAIL: ${FLOODAI_ADMIN_EMAIL:-}
      FLOODAI_ADMIN_PASSWORD: ${FLOODAI_ADMIN_PASSWORD:-}
      FLOODAI_SMTP_USER: ${FLOODAI_SMTP_USER:-}
      FLOODAI_SMTP_APP_PASSWORD: ${FLOODAI_SMTP_APP_PASSWORD:-}
      FLOODAI_EMAIL_FROM: ${FLOODAI_EMAIL_FROM:-}
      FLOODAI_BASE_URL: ${FLOODAI_BASE_URL:-http://localhost:8000}
      FLOODAI_COOKIE_SECURE: ${FLOODAI_COOKIE_SECURE:-false}
    volumes:
      - floodai_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: floodai-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      floodai-api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: floodai-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  floodai_data:
