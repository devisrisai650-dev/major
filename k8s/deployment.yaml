apiVersion: apps/v1
kind: Deployment
metadata:
  name: floodai-api
  namespace: floodai
  labels:
    app: floodai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: floodai-api
  template:
    metadata:
      labels:
        app: floodai-api
    spec:
      containers:
        - name: floodai-api
          image: floodai-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: floodai-api-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
