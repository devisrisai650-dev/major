apiVersion: apps/v1
kind: Deployment
metadata:
  name: floodai-api
  namespace: floodai
  labels:
    app: floodai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: floodai-api
  template:
    metadata:
      labels:
        app: floodai-api
    spec:
      volumes:
        - name: auth-data
          persistentVolumeClaim:
            claimName: floodai-auth-data
      containers:
        - name: floodai-api
          image: floodai-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: floodai-api-config
            - secretRef:
                name: floodai-auth-secrets
                optional: true
          volumeMounts:
            - name: auth-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
