apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: floodai
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: floodai-api
        metrics_path: /metrics
        static_configs:
          - targets: ["floodai-api:8000"]
